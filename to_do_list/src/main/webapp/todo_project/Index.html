<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link  rel="stylesheet" href="./css/style.css">
</head>
<body>
<main class="main-box">

	<li>아직 할 일이 없습니다</li>
</ul>
</main>
</body>
<script src="./js/script.js"></script>
</html>
