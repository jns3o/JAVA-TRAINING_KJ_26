<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="./css.css">
</head>
<body>
<main class="container">
  <section class="course-section">
    <h1>프론트엔드 기초 강좌</h1>
    <div class="course-list">
      <article class="course-card">
        <img src="images/html.jpg" alt="HTML 강좌 교재 화면">
        <h2>HTML 기초</h2>
        <p>웹페이지의 구조를 작성하는 방법을 학습합니다.</p>
        <a href="#application">수강 신청</a>
      </article>
      <article class="course-card">
        <img src="images/css.jpg" alt="CSS 강좌 교재 화면">
        <h2>CSS 기초</h2>
        <p>웹페이지의 디자인과 배치 방법을 학습합니다.</p>
        <a href="#application">수강 신청</a>
      </article>
      <article class="course-card">
        <img src="images/layout.jpg" alt="웹 레이아웃 강좌 교재 화면">
        <h2>웹 레이아웃</h2>
        <p>Flex와 Grid를 이용한 화면 배치를 학습합니다.</p>
        <a href="#application">수강 신청</a>
      </article>
    </div>
  </section>
  <section id="application" class="application-section">
    <h2>수강 신청</h2>
    <form action="#" method="post">
      <div class="form-item">
        <label for="userName">이름</label>
        <input id="userName" name="userName" type="text" required>
      </div>
      <div class="form-item">
        <label for="userEmail">이메일</label>
        <input id="userEmail" name="userEmail" type="email" required>
      </div>
      <div class="form-item">
        <label for="course">신청 강좌</label>
        <select id="course" name="course">
          <option value="">강좌를 선택하세요</option>
          <option value="html">HTML 기초</option>
          <option value="css">CSS 기초</option>
          <option value="layout">웹 레이아웃</option>
        </select>
      </div>
      <button type="submit">신청하기</button>
    </form>
  </section>
</main>
</body>
</html>
