<div class="form-group">
<label for="약관">-국제인재개발원 이용 약관</label><br>
<textarea id="약관" rows="15" cols="60" style="font-size: 13px; font-weight: normal;"readonly>
개인정보 보호법 제15조제1항제4호(계약 체결/이행)에 따라, 아래와 같이 개인정보를 수집·이용합니다.
국제인재개발원 회원가입 시 하나의 계정으로 전체 국제인재개발원 서비스 이용이 가능하며, 여기에는 국제인재개발원에서 제공하는 개인 맞춤형 서비스와 인공지능(AI) 서비스가 포함됩니다.

<1. 수집하는 개인정보 항목>
회원 가입 시
아이디, 비밀번호, 이름, 이름, 이메일(e-mail), 성별, 최종학력, 거주지
회원가입 과정에서 본인 인증 완료 시
연계정보(CI), 중복가입 확인정보(DI), 내외국인 정보
서비스 이용 시
IP주소, 쿠키, 서비스 이용 기록, 기기정보, 위치정보, 이미지 및 음성 정보(이미지나 음성을 이용한 서비스를 이용하는 경우)
만 14세 미만 아동 법정대리인 동의 시
법정대리인의 정보(법정대리인의 이름, 중복가입확인정보(DI), 휴대전화번호(아이핀 인증인 경우 아이핀 번호)

위 내용 외에 개별 국제인재개발원 서비스 제공 과정에서 개인정보 처리가 필요할 경우, 해당 서비스 이용자 대상으로 개인정보를 추가로 수집ㆍ이용할 수 있으며, 이에 대해서는 개인정보 처리방침에서 상세히 공개하고 있습니다.

<2. 수집 및 이용목적>
회원 관리를 위하여 개인정보를 이용합니다.
회원 가입 의사의 확인, 연령 확인 및 법정대리인 동의 진행, 이용자 및 법정대리인의 본인 확인, 이용자 식별, 회원탈퇴 의사의 확인 등 회원관리를 위하여 개인정보를 이용합니다.
이용자 보호 및 안전한 서비스 이용환경 구축을 위하여 개인정보를 이용합니다.
법령 및 국제인재개발원 이용약관을 위반하는 회원에 대한 이용 제한 조치, 부정 이용 행위를 포함하여 서비스의 원활한 운영에 지장을 주는 행위 방지 및 제재, 계정도용 및 부정거래 방지, 보안ㆍ프라이버시ㆍ안전 측면에서 이용자가 안심하고 이용할 수 있는 서비스 이용환경 구축을 위해 개인정보를 이용합니다.
서비스 제공과 운영을 위하여 개인정보를 이용합니다.
약관 개정 등의 고지사항 전달, 분쟁조정을 위한 기록 보존, 민원처리 등 서비스 운영을 위하여 개인정보를 이용합니다. 또한 검색 결과를 포함한 기존 국제인재개발원 콘텐츠 및 서비스(광고 포함) 제공을 위해 개인정보를 이용하며, 이용자에게 유용한 이벤트 정보와 참여 기회 제공, 마케팅·프로모션을 목적으로도 개인정보를 이용합니다. 단, 마케팅·프로모션 과정에서의 개인정보 처리는 필요할 경우, 관련 법령에 따라 이용자의 별도 동의를 받고 진행합니다.
유료 서비스 제공을 위하여 개인정보를 이용합니다.
유료 서비스 제공에 따르는 본인인증, 요금 결제 및 정산, 세금계산서 발행 등 세법 상 필요한 제반 업무 처리, 상품 및 서비스의 배송, 채권추심을 위하여 개인정보를 이용합니다.
서비스 개선, 기술 개발, 신규 서비스 요소의 발굴, 서비스 경험 향상을 위하여 개인정보를 이용합니다.
기존에 제공 중인 서비스를 개선하고, 더 나은 서비스를 제공하기 위한 기술 개발ㆍ신규 서비스 요소의 발굴 등을 위하여 개인정보를 이용합니다. 또한, 서비스 제공에 따른 효과 분석, 그리고 서비스 품질 및 사용자 경험 향상을 위한 목적으로 개인정보를 이용합니다.
콘텐츠와 광고를 포함한 맞춤 서비스 제공을 위하여 개인정보를 이용합니다.
개인정보 및 관심에 기반하여 이용자간 네트워크 형성을 지원하며, 지인 및 관심사 등에 기반한 맞춤형 서비스를 제공합니다. 맞춤 서비스 제공을 위하여 서비스 이용기록을 분석하고 통계 처리를 하며, 분석 결과에 기반하여 개인별로 유용한 맞춤 콘텐츠ㆍ서비스를 추천하고 검색 결과를 제공합니다. 또한 이용자에게 정보로서 가치있는 개인 맞춤 광고를 제공 및 표시하는 데에 개인정보를 이용합니다.
국제인재개발원 서비스 제공 및 개선, 새로운 기술 개발과 신규 서비스 요소의 발굴, 서비스 경험 향상, 개인 맞춤형 서비스(광고 포함) 제공 등 국제인재개발원 서비스 전반에 인공지능(AI) 기술이 적용되며, 인공지능 기술 개발을 위하여 개인정보를 이용합니다.

<3. 개인정보의 보유기간>
국제인재개발원은 개인정보의 보관기간을 가입일로부터 6년동안 보관하며, 1년마다 개인정보 이용 동의에 관한 문자를 발송해드리고 있습니다.
(가입일 기준 1년마다 발송되는 문자에 동의에 관한 수신을 하지 않으실 경우 동의로 간주하고 있습니다, 수신 거부가능)

자세한 내용은 개인정보 처리방침에서 확인하실 수 있습니다.

<4. 동의 거부권 및 불이익>
개인정보보호법에 따라 가입하고자 하는 이용자는 '국제인재개발원'에서 요구하는 개인정보 수집에 관한 동의여부에 대해 거부를 할 수 있으며
단, 개인정보 수집에 관해 거부 시 회원가입 불가 또는 사이트 이용에 제약이 따를 수 있음을 알려드립니다
또한 개인정보이용 동의 내역을 제대로 확인하지 않고 가입하였을 경우 추후 발생하는 문제 또는 법적 분쟁에 대해서 '국제인재개발원'에서는 책임을 지지 않습니다
(기타 개인정보보호법 및 동의에 관한 내용은 'https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4%EB%B3%B4%ED%98%B8%EB%B2%95'을 참고하여 주십시오)
</textarea>
