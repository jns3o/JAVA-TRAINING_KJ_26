<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<h1>국제인재개발원 회원가입</h1><br>
<label for="nkname">ID</label><br>
<input id="nkname" type="text" placeholder="아이디(최대 10자)" maxlength="10" autofocus required>
<br><br>
<label for="pwNum">Password</label><br>
<input id="pwNum" type="password" placeholder="비밀번호(최대 10자)" maxlength="10" required>
<br><br>
<label for="name">Name</label><br>
<input id="name" type="text" placeholder="이름(최대 6자)" maxlength="6" required>
<br><br>
<label for="age">나이</label><br>
<input id="age" type="number" min="0" max="140" >
<br><br>
<label>성별</label><br>
<input id="male" type="radio" name="gender">
<label for="male">남자</label> 
<input id="female" type="radio" name="gender">
<label for="female">여자</label>
<br><br>
<label>최종학력</label><br>
<input id="elementary" type="radio" name="school">
<label for="elementary">초등학교</label>
<input id="middle" type="radio" name="school">
<label for="middle">중학교</label>
<input id="high" type="radio" name="school">
<label for="high">고등학교</label>
<input id="college" type="radio" name="school">
<label for="college">대학교</label>

<br><br>

<label for="place">거주지</label><br>
<select id="place">
		<option value="seoul">서울특별시</option>
	<optgroup label="인천,경기도">
		<option value="ik_inc">인천광역시</option>
		<option value="ik_goy">경기도 고양시</option>
		<option	value="ik_paj">경기도 파주시</option>
		<option value="ik_sgn">경기도 성남시</option>
		<option value="ik_hwa">경기도 화성시</option>
	</optgroup>
	<optgroup label="대전/세종/충청남도/충청북도">
		<option value="chu_dae">대전광역시</option>
		<option value="chu_sej">세종특별자치시</option>
		<option value="chu_che">충청남도 천안시</option>
		<option value="chu_cho">충청북도 청주시</option>
		<option value="chu_ses">충청남도 서산시</option>
	</optgroup>
	<optgroup label="전남광주/전북/제주">
		<option value="jgw_gwn_bukgu">전남광주통합특별시 북구</option>
		<option value="jgw_gwn_seogu">전남광주통합특별시 서구</option>
		<option value="jgw_gwn_gwangsan">전남광주통합특별시 광산구</option>
		<option value="jgw_gwn_donggu">전남광주통합특별시 동구</option>
		<option value="jgw_gwn_namgu">전남광주통합특별시 남구</option>
		<option value="jgw_naju">전남광주통합특별시 나주시</option>
		<option value="jgw_yeosu">전남광주통합특별시 여수시</option>
		<option value="jgw_gwangyang">전남광주통합특별시 광양시</option>
		<option value="jgw_haenam">전남광주통합특별시 해남군</option>
		<option value="jb_jeonju">전북특별자치도 전주시</option>
		<option value="jb_gunsan">전북특별자치도 군산시</option>
		<option value="jb_gochang">전북특별자치도 고창군</option>
		<option value="jb_buan">전북특별자치도 부안군</option>
		<option value="jeju_jeju">제주특별자치도 제주시</option>
		<option value="jeju_seogwi">제주특별자치도 서귀포시</option>
	</optgroup>
	<optgroup label="경북/경남/울산/부산">
		<option value="gys_busan">부산광역시</option>
	</optgroup>
</select>
</body>
</html>
