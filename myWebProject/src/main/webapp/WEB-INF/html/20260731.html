p{
	text-align: left;
	letter-spacing: 0;
	word-spacing: 0;
	line-height: 1.5em;
	text-indent: 1em;
}
.list{
	list-style: circle;

	list-style: upper-alpha;

<body>
	<p>
	소년은 개울가에서 소녀를 보자 곧 윤 초시네 증손녀(曾孫女)딸이라는 걸 알 수 있었다. 소
	녀는 개울에다 손을 잠그고 물장난을 하고 있는 것이다. 서울서는 이런 개울물을 보지 못하
	기나 한 듯이. 벌써 며칠째 소녀는, 학교에서 돌아오는 길에 물장난이었다. 그런데, 어제까
	지 개울 기슭에서 하더니, 오늘은 징검다리 한가운데 앉아서 하고 있다. 소년은 개울둑에 앉
	아 버렸다. 소녀가 비키기를 기다리자는 것이다.
	</p>
	
	<ol class="ol-list">
		<li>사과</li>
		<li>바나나</li>
		<li>포도</li>
		<li>오렌지</li>
	</ol>
