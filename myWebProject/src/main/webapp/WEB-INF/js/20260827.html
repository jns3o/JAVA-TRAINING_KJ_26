<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
  	body{
  		padding : 16px 32px;
  	}
  	
  	section{
  		margin : 12px 0;
  		padding: 8px 24px;
  		background-color: bisque;
  		border-radius: 12px;
  	}
  	
  	section.plant{
  		background-color: lightgreen;
  	}
  	
  	.soldout{
  		display: none;
  	}
  	
  	.organic::after{
  		content : ' (유기농)';
  	}
  </style>
  <title>요소 선택하기</title>
</head>
<body>
  <h1>장보기 목록</h1>

  <section id="veg" class="plant">
    <h2>채소</h2>
    <ul>
      <li>당근</li>
      <li>오이</li>
      <li class="soldout">양파</li>
    </ul>
  </section>
  <section id="sweets" class="plant">
    <h2>과일</h2>
    <ul>
      <li id="apple">사과</li>
      <li>딸기</li>
      <li>포도</li>
    </ul>
  </section>
  <section>
    <h2>고기</h2>
    <ul>
      <li class="soldout">소고기</li>
      <li>돼지고기</li>
      <li class="soldout">닭고기</li>
    </ul>
  </section>
</body>
<script>
  const $listItem = document.getElementsByTagName('li');
  console.log($listItem);
  
  const $plantList = document.getElementsByClassName('soldout');
  console.log($plantList);
  
  const $sweet = document.getElementById('apple');
  $sweet.textContent = "맛있는 사과";
  
  console.log($sweet);
  
  const $selector = document.querySelectorAll('section.plant');
  console.log($selector);
  
  const $onion = document.querySelector('#veg ul').lastElementChild;
  console.log($onion.classList);
  $onion.classList.remove("soldout");
  $onion.classList.add('organic');
  
  $onion.style['font-size'] = '2em';
  $onion.style.color = 'plum';
  $onion.style.fontSize = '1em';
  
  // hidden이나 none으로 없어진게 아니라 html상에서 아예 사라져버린것
  const $ul = document.querySelector('#veg ul');
  $ul.removeChild($onion);
  
  while($ul.firstElementChild){
	  $ul.removeChild($ul.firstElementChild);
  }
  
  const $tomato = document.createElement('li');
  console.log($tomato);
  $tomato.textContent = ('토마토');
  console.log($tomato);
  
  $ul.appendChild($tomato);
  
  const veges = ['상추', '가지', '브로콜리'];
  for (const itm of veges){
	  const $el = document.createElement('li');
	  $el.textContent = itm;
	  $ul.appendChild($el);
  }
  </script>
</html>
